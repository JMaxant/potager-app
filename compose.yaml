services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: potager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-potager}
      POSTGRES_DB: potager
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potager -d potager"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://potager:${POSTGRES_PASSWORD:-potager}@db:5432/potager?sslmode=disable
      LISTEN_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
