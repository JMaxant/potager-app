name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: potager
          POSTGRES_PASSWORD: potager
          POSTGRES_DB: potager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U potager -d potager"
          --health-interval=5s --health-timeout=3s --health-retries=10

    env:
      DATABASE_URL: postgres://potager:potager@localhost:5432/potager?sslmode=disable

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install tools
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          go install github.com/a-h/templ/cmd/templ@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Migrate
        run: goose -dir migrations postgres "$DATABASE_URL" up

      # Generated code must match its source: a stale commit fails here rather
      # than drifting silently.
      - name: Check generated code is current
        run: |
          sqlc diff
          templ generate --check

      - run: go vet ./...
      - run: staticcheck ./...
      - run: go test -race ./...
