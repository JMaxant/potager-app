on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkouts project.
        uses: actions/checkout@v7
      - name: Installs go.
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            tools.sum
      - name: Installs task.
        uses: go-task/setup-task@v2
        with:
          version: 3.x
      - name: Runs linter.
        run: task lint
      - name: Launch Postgres.
        run: task init && task up
