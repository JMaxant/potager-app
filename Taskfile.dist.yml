# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

# Task loads .env; the binary never reads it (see docs/design.md).
dotenv: ['.env']

vars:
  COMPOSE: docker compose
  TOOLS: go tool -modfile=tools.mod

tasks:
  default:
    cmd: task --list

  init:
    desc: Copies .env.example to .env.
    cmd: cp .env.example .env

  up:
    desc: Start Postgres locally
    cmd: "{{.COMPOSE}} up -d --wait db"

  down:
    desc: Stop the local stack
    cmd: "{{.COMPOSE}} down"

  ps:
    desc: Displays compose container status
    cmd: "{{.COMPOSE}} ps"

  migrate:
    desc: Apply migrations
    cmd: "{{.TOOLS}} goose -dir migrations postgres \"$DATABASE_URL\" up"

  migrate:down:
    desc: Roll back the last migration
    cmd: "{{.TOOLS}} goose -dir migrations postgres \"$DATABASE_URL\" down"

  generate:
    desc: Regenerate sqlc and templ output
    cmds:
      - "{{.TOOLS}} sqlc generate"
      - "{{.TOOLS}} templ generate"

  run:
    desc: Run the server
    cmd: go run ./cmd/potager

  test:
    desc: Run the test suite
    cmd: go test -race ./...

  lint:
    desc: Vet and static analysis
    cmds:
      - go vet ./...
      - "{{.TOOLS}} staticcheck ./..."

  check:
    desc: Everything CI runs, note that it will fail until CI is properly implemented.
    cmds:
      - task: lint
      - task: test
      - "{{.TOOLS}} sqlc diff"
      - "{{.TOOLS}} templ generate --check"
