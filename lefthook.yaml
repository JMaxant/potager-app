pre-commit:
  parallel: true
  jobs:
    - name: Checks formatting.
      glob: "*.go"
      run: |
        files=$(gofmt -l {staged_files})
        if [ -n "$files" ]; then
          echo "Bad formatting on files :"
          echo "$files" | sed 's/^/  - /'
          echo
          echo "fix with : gofmt -w $(echo $files)"
          exit 1
        fi
